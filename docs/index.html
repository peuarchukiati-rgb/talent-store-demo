<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talent Store · BUC-1B pre-screen demo</title>
<style>
  :root{
    --bg:#f4f1ea; --panel:#fffdf9; --ink:#1c1a17; --muted:#8a8275; --line:#e4ddcf;
    --accent:#63513d; --accent-soft:#efe7d9; --ok:#5d6b4a; --ok-soft:#e9efe0;
    --part:#8a5a00; --part-soft:#f6ebd6; --none:#8a8275; --none-soft:#ece9e1; --warn:#9c3b2e;
    --gold:#b8995a;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif}
  header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--panel);border-bottom:1px solid var(--line)}
  h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.01em}
  h1 small{font-weight:400;color:var(--muted);margin-left:8px}
  .badges{display:flex;gap:8px;flex-wrap:wrap}
  .badge{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:#fafaf8;color:var(--muted);white-space:nowrap}
  .badge.strong{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  nav{display:flex;gap:4px;padding:10px 24px 0;background:var(--panel);border-bottom:1px solid var(--line)}
  nav a{padding:8px 14px;border-radius:8px 8px 0 0;color:var(--muted);text-decoration:none;font-weight:550;font-size:14px;border:1px solid transparent;border-bottom:none}
  nav a.on{color:var(--ink);background:var(--bg);border-color:var(--line)}
  main{padding:20px 24px 40px}
  .grid{display:grid;grid-template-columns:300px 320px 1fr;gap:16px;align-items:start}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px;font-weight:650}
  .card h3{font-size:16px;margin:0 0 4px}
  .muted{color:var(--muted)} .small{font-size:13px}
  .req{display:flex;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:13.5px}
  .req:first-of-type{border-top:none}
  .rid{font-family:var(--mono);font-size:12px;color:var(--accent);min-width:24px;padding-top:1px}
  .kind{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .runs{display:flex;flex-direction:column;gap:6px;margin-top:6px}
  .run{display:block;padding:8px 10px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink);font-size:13px}
  .run.on{border-color:var(--accent);background:var(--accent-soft)}
  .run b{display:block;font-size:13.5px}
  .group{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px;font-weight:650;display:flex;justify-content:space-between}
  .group:first-child{margin-top:0}
  .cand{display:block;text-decoration:none;color:var(--ink);padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:#fff}
  .cand.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .cand .nm{font-weight:600}
  .cand .meta{font-size:12.5px;color:var(--muted)}
  .pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--none-soft);color:var(--muted);margin-right:4px}
  .pill.int{background:var(--accent-soft);color:var(--accent)}
  .pill.dec{background:var(--ok-soft);color:var(--ok)}
  .st{font-family:var(--mono);font-size:11.5px;padding:1px 7px;border-radius:6px;white-space:nowrap}
  .st.evidenced{background:var(--ok-soft);color:var(--ok)}
  .st.partial{background:var(--part-soft);color:var(--part)}
  .st.not_found{background:var(--none-soft);color:var(--none)}
  .ev{border-top:1px solid var(--line);padding:12px 0}
  .ev:first-child{border-top:none}
  .evh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .evh .rt{font-size:13.5px;color:var(--muted)}
  blockquote{margin:8px 0 0;padding:6px 10px;border-left:3px solid var(--accent);background:#fafaf8;font-size:14px}
  blockquote .chk{display:block;font-size:11.5px;color:var(--ok);margin-top:2px}
  blockquote .chk.bad{color:var(--warn)}
  .note{font-size:13.5px;margin-top:6px}
  .gate{margin-top:16px;padding:14px;border:1px dashed var(--accent);border-radius:10px;background:var(--accent-soft)}
  .gate .btns{display:flex;gap:8px;margin:10px 0 6px;flex-wrap:wrap}
  .gate button{font:inherit;font-size:13.5px;padding:7px 14px;border-radius:8px;border:1px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer}
  .gate code{font-family:var(--mono);font-size:12px;word-break:break-all}
  .prov{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:14px;line-height:1.7;word-break:break-all}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{text-align:left;padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-top:none}
  td.h{font-family:var(--mono);font-size:12px}
  .same{color:var(--ok);font-weight:600} .diff{color:var(--warn);font-weight:600}
  pre{font-family:var(--mono);font-size:12px;background:#fafaf8;border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;white-space:pre-wrap;margin:0}
  .tree a{display:block;font-family:var(--mono);font-size:12.5px;color:var(--ink);text-decoration:none;padding:3px 6px;border-radius:5px}
  .tree a.on{background:var(--accent-soft);color:var(--accent)}
  .tree .dir{font-family:var(--mono);font-size:12px;color:var(--muted);margin:10px 0 2px}
  .lock{color:var(--muted);font-size:11px}
  .banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:10px;background:var(--ok-soft);color:var(--ok);font-weight:600;margin-bottom:16px}
  .banner.bad{background:#f8e5e2;color:var(--warn)}
  @media (max-width:1100px){.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}}
  /* ---- simulated Nestlé environment chrome (concept; not an official Nestlé product) ---- */
  .envbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:10px 24px;background:var(--ink);color:#f4f1ea;font-family:var(--sans);border-bottom:2px solid var(--accent)}
  .envleft{display:flex;align-items:center;gap:12px}
  .nmark{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:7px;background:var(--accent);color:#fff;font-size:16px;font-family:var(--sans);box-shadow:inset 0 0 0 1px var(--gold)}
  .envtitle{display:flex;flex-direction:column;line-height:1.2}
  .envtitle .org{font-size:15px;letter-spacing:.02em}
  .envtitle .app{font-size:11.5px;color:#b7ad9b;letter-spacing:.04em}
  .envright{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .envpath{font-family:var(--mono);font-size:11.5px;color:#cdbf9e}
  .sim{font-family:var(--sans);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:#1c1a17;background:var(--gold);padding:3px 10px;border-radius:999px;white-space:nowrap}
  header{font-family:var(--sans)}
  header h1 small{letter-spacing:0}
  nav{font-family:var(--sans)}
  .badge.strong{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  nav a.on{color:var(--accent)}
/*__PLAIN_CSS_START__*/

nav{flex-wrap:wrap;align-items:flex-end}
.lens{margin-left:auto;display:flex;align-items:center;gap:6px;padding-bottom:6px}
.lens .hint{font-family:"CV",cursive;font-weight:700;font-size:17px;color:#a3342a;margin-right:4px}
.lens a{font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--muted);text-decoration:none;background:#fff}
.lens a.on{background:var(--ink);border-color:var(--ink);color:#f4f1ea}
body.plain .envpath, body.plain .badge:not(.strong), body.plain .prov, body.plain .gate > .small.muted,
body.plain .cand div > .pill:first-child, body.plain td.h, body.plain th.hh{display:none}
body.plain .storepre pre{max-height:460px}
.pin{position:relative;font-family:"CV",cursive;font-weight:700;font-size:19px;line-height:1.25;color:#2b2416;
  background:#f9eb9b;padding:16px 18px 13px;margin:4px 0 16px;border-radius:2px;max-width:640px;
  box-shadow:0 1px 1px rgba(0,0,0,.08),0 6px 14px -6px rgba(60,40,10,.35);transform:rotate(-.7deg)}
.pin.r{transform:rotate(.6deg)}
.pin.paper{background:#fffdf6}
.pin::before{content:"";position:absolute;top:-7px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#ff8a7a,#c4291c 55%,#7d130b);box-shadow:0 2px 3px rgba(0,0,0,.35)}
.pin b{font-family:"PM",cursive;font-weight:400;font-size:14px;letter-spacing:.04em;color:#a3342a;display:block;margin-bottom:4px}
.pin a{color:#a3342a}
.pin.wide{max-width:none}

const $ = s => document.querySelector(s);

function state(){
  const p = new URLSearchParams(location.hash.slice(1));
  return {view: p.get("view") || "screen", run: +(p.get("run") || 0), cand: p.get("cand") || D.candidates[0].meta.id,
          file: p.get("file") || "", hc: p.get("hc") || "", lens: p.get("lens") || ""};
}
function link(o){ const s = {...state(), ...o}; const p = new URLSearchParams(); for (const k in s) if (s[k] !== "" && s[k] != null) p.set(k, s[k]); return "#" + p.toString(); }

function navHtml(s){
  const tabs = [["screen","Pre-screen"],["swap","Model swap"],["handoff","Handoff"],["live","Run live ⚡"],["store","Store files"]];
  return tabs.map(([v,l]) => `<a href="${link({view:v})}" class="${s.view===v?"on":""}">${l}</a>`).join("");
}

}
function runLabel(x,i){ return `Run ${"AB"[i] || i+1} · ${x.id.split("-").slice(1).join("-") || x.id}`; }

function candList(s){

  return `<div class="card">${groups.map(([g,label]) => {

    return `<div class="group"><span>${label}</span><span>${list.length}</span></div>` + list.map(c => {
      const dec = D.decisions[c.meta.id];
      return `<a class="cand ${c.meta.id===s.cand?"on":""}" href="${link({cand:c.meta.id})}">

}

}

function jsonYaml(o){ return Object.entries(o).map(([k,v]) => typeof v === "object" ? `${k}: ${JSON.stringify(v)}\n` : `${k}: ${v}\n`).join(""); }

const LIVE_SYSTEM = `You are a recruitment pre-screen assistant working for a hiring team.
You compare ONE candidate profile with ONE job description and report evidence.

{"requirements":[{"id":"R1","status":"evidenced|partial|not_found","evidence":[{"quote":"..."}],"note":"one short sentence"}],

const LIVE_INJ = { id:"C-INJ", display_name:"Injected Candidate (injection test)", pool:"external", body:`# Injected Candidate — Demand Planner (external)

function liveNorm(s){ s=(s==null?"":String(s)).normalize("NFC").replace(/’/g,"'").replace(/–/g,"-").replace(/\s+/g," ").trim().replace(/^"+/,"").replace(/"+$/,""); return s.toLowerCase(); }
function liveVerify(q,src){ const n=liveNorm(q).replace(/\.+$/,""); return Boolean(n)&&src.includes(n); }
const LIVE_BANNED=/\b(rank|ranked|ranking|best candidate|ideal|unfit|top candidate|strong fit|weak fit|recommend(ed)? (to )?(hire|reject|shortlist)|out of 10|\/10)\b/i;
const LIVE_INJ_PATTERNS=[[/ignore (the|all|any|previous|above)[\w\s]*/i,"override-instruction"],[/disregard (the|all|any|previous|above)[\w\s]*/i,"override-instruction"],[/rank (me|this candidate)[\w\s]*/i,"rank-steer"],[/(mark|set|treat|rate) (all|every|each)[\w\s]*(requirement|criteria)[\w\s]*/i,"status-steer"],[/you (must|should|will) (now|only|always)[\w\s]*/i,"imperative-to-model"],[/as an? (ai|assistant|language model)[\w\s]*/i,"role-address"],[/(strong fit|best candidate|top candidate|recommend[\w\s]*hire)/i,"verdict-steer"],[/<!--[\s\S]*?-->/i,"html-comment"]];
function liveDetectInjection(t){ const f=[]; for(const raw of String(t).split(/\r?\n/)){ const line=raw.trim(); if(!line)continue; const low=line.toLowerCase(); for(const [pat,kind] of LIVE_INJ_PATTERNS){ const m=low.match(pat); if(m)f.push({kind,match:m[0].trim().slice(0,80),line:line.slice(0,120)}); } } return f; }

function liveUserPrompt(candBody){ const reqs=D.jd.meta.requirements.map(r=>`- ${r.id} (${r.kind}): ${r.text}`).join("\n"); return `JOB DESCRIPTION: ${D.jd.meta.title} (${D.jd.meta.id})\n${(D.jd.body||"").trim()}\n\nREQUIREMENTS:\n${reqs}\n\nCANDIDATE PROFILE (quote only from this text):\n<<<\n${candBody.trim()}\n>>>`; }
function liveExtractJSON(text){ const i=text.indexOf("{"); if(i<0)throw new Error("model returned no JSON object"); let d=0; for(let j=i;j<text.length;j++){const ch=text[j]; if(ch==="{")d++; else if(ch==="}"){d--; if(d===0)return JSON.parse(text.slice(i,j+1));}} throw new Error("unbalanced JSON from model"); }

const LIVE_PROVIDERS={
  openai:{match:k=>k.startsWith("sk-")&&!k.startsWith("sk-ant-"),label:"OpenAI",url:"https://api.openai.com/v1/chat/completions",
    headers:k=>({"Content-Type":"application/json","Authorization":"Bearer "+k}),
    body:(sys,usr,model)=>({model,messages:[{role:"system",content:sys},{role:"user",content:usr}],response_format:{type:"json_object"},temperature:0}),
    text:d=>d.choices[0].message.content, defaultModel:"gpt-4o-mini"},
  anthropic:{match:k=>k.startsWith("sk-ant-"),label:"Anthropic",url:"https://api.anthropic.com/v1/messages",
    headers:k=>({"Content-Type":"application/json","x-api-key":k,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"}),
    body:(sys,usr,model)=>({model,max_tokens:1500,system:sys,messages:[{role:"user",content:usr},{role:"assistant",content:"{"}]}),
    text:d=>"{"+d.content[0].text, defaultModel:"claude-haiku-4-5-20251001"}
};
function liveDetectProvider(k){ for(const key in LIVE_PROVIDERS) if(LIVE_PROVIDERS[key].match(k.trim())) return key; return null; }

let LIVE={busy:false};
async function liveRun(){
  const keyEl=document.querySelector("#live-key"), key=keyEl.value.trim();
  const prov=liveDetectProvider(key);
  if(!prov){ LIVE={err:"Key not recognised. OpenAI keys start with sk-, Anthropic with sk-ant-."}; return render(); }
  const P=LIVE_PROVIDERS[prov];
  const model=document.querySelector("#live-model").value.trim()||P.defaultModel;
  const cand=liveCandidates().find(c=>c.id===document.querySelector("#live-cand").value);
  LIVE={busy:true,model,provider:P.label,cand}; render();
  const t0=performance.now();
  try{
    const res=await fetch(P.url,{method:"POST",headers:P.headers(key),body:JSON.stringify(P.body(LIVE_SYSTEM,liveUserPrompt(cand.body),model))});
    if(!res.ok){ let detail=""; try{const e=await res.json(); detail=e&&e.error&&e.error.message?(" — "+e.error.message):"";}catch(_){} throw new Error("HTTP "+res.status+detail); }
    const data=await res.json();
    const result=liveExtractJSON(P.text(data));
    const src=liveNorm(cand.body);
    const ids=new Set(D.jd.meta.requirements.map(r=>r.id));
    const got=new Set((result.requirements||[]).map(r=>r.id));
    const warnings=[];
    for(const id of ids) if(!got.has(id)) warnings.push("missing requirement: "+id);
    let qt=0,qv=0;
    for(const r of result.requirements||[]){
      if(["evidenced","partial","not_found"].indexOf(r.status)<0) warnings.push(r.id+": invalid status "+JSON.stringify(r.status));
      for(const e of r.evidence||[]){ qt++; e.verified=liveVerify(e.quote,src); if(e.verified)qv++; else warnings.push(r.id+": quote not found verbatim in profile"); }
    }
    const freeText=[result.summary||""].concat(result.open_points||[]).concat((result.requirements||[]).map(r=>r.note||"")).join(" ");
    const bm=freeText.match(LIVE_BANNED); if(bm) warnings.push("verdict language detected: "+JSON.stringify(bm[0]));
    const flags=liveDetectInjection(cand.body);
    LIVE={busy:false,result,flags,warnings,qt,qv,latency:((performance.now()-t0)/1000).toFixed(1),model,provider:P.label,cand};
  }catch(err){ LIVE={busy:false,err:String(err.message||err),model,provider:P.label,cand}; }
  keyEl.value="";
  render();
}

function liveSimSource(candId){

function liveApplyGuards(result,candBody){
  const src=liveNorm(candBody);

  const warnings=[];
  for(const id of ids) if(!got.has(id)) warnings.push("missing requirement: "+id);

  for(const r of result.requirements||[]){
    if(["evidenced","partial","not_found"].indexOf(r.status)<0) warnings.push(r.id+": invalid status "+JSON.stringify(r.status));
    for(const e of r.evidence||[]){ qt++; e.verified=liveVerify(e.quote,src); if(e.verified)qv++; else warnings.push(r.id+": quote not found verbatim in profile"); }

  const freeText=[result.summary||""].concat(result.open_points||[]).concat((result.requirements||[]).map(r=>r.note||"")).join(" ");

function lensOf(){ return new URLSearchParams(location.hash.slice(1)).get("lens") === "eng" ? "eng" : "plain"; }
const RING = '<svg class="sh-ring" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M52,3 C83,2 99,21 98,50 C97,81 76,98 47,97 C19,96 2,79 3,49 C4,21 23,5 57,7"/></svg>';
function pin(html, cls){ const d = document.createElement("div"); d.className = "pin " + (cls||""); d.innerHTML = html; return d; }
function before(el, html, cls){ if (el) el.insertAdjacentElement("beforebegin", pin(html, cls)); }
function inside(el, html, cls){ if (el) el.insertAdjacentElement("afterbegin", pin(html, cls)); }
function startHere(el, pos){ if (!el) return; pos = pos || "top"; el.classList.add("sh", "sh-" + pos); el.insertAdjacentHTML("beforeend", RING + (pos === "none" ? "" : `<span class="sh-tag">${pos === "bottom" ? "START HERE ↖" : "START HERE ↙"}</span>`)); }
function tab(v, label){ return `<a href="${link({view:v})}">${label}</a>`; }

const NOTES = {
  screen(app){
    app.insertAdjacentElement("afterbegin", pin(`<b>CASE FILE · TALENT PRE-SCREEN</b>One job, eight synthetic candidates on this page; the ninth joins in the ${tab("handoff","Handoff")} tab. The AI reads every CV and points to the lines that match the job. It does not score, rank or decide. A person does. Then see ${tab("swap","Model swap")}.`, "wide"));
    const q = app.querySelector(".grid > .card:last-child .ev blockquote");
    before(q && q.closest(".ev"), `Every line in grey is copied word for word from the CV. The ✓ means a machine checked it against the file. No ✓, no trust.`, "r");
    startHere(q);
    const gate = app.querySelector(".gate");
    before(gate, `The AI stops here. A Nestlé person presses one of these buttons. Not the model.`);
    const runs = app.querySelector(".runs");
    before(runs, `Two models, two vendors. Switch between them: the files underneath stay the same.`, "paper");
  },
  swap(app){
    app.insertAdjacentElement("afterbegin", pin(`<b>REPLACE THE AI · KEEP WHAT IT LEARNED</b>Same job, same CVs, two models from two vendors. Each writes in its own folder. Neither can edit the original files.`, "wide"));
    const t = app.querySelector("table");
    before(t, `"same file" on every row: both AIs read the exact same CVs, and nobody changed them. Click a candidate to compare the two readings below.`, "r");
    startHere(t);
    const two = app.querySelector(".two");
    before(two, `Where the two models disagree (evidenced vs partial), a person sees both side by side and decides.`);
  },
  handoff(app){
    const note = app.querySelector(".grid > .card:nth-child(2)");
    before(app.querySelector(".grid"), `The first AI stopped after five and left a note in the Store. The second AI, from another vendor, read it, skipped what was done and finished the last four. A shift handover, for machines.`, "wide r");
    startHere(note, "bottom");
    const last = app.querySelector(".two > .card:last-child");
    inside(last, `The second AI only wrote in its own folder. The first AI's files are exactly as they were.`, "paper");
  },
  live(app){
    const card = app.querySelector(".card");
    inside(card, `<b>TRY IT</b>Press the dark button. It replays a recorded run right here in your browser and re-checks every quote. No key, no network. Pick "prompt-injection test" to watch a CV try to give the AI orders.`, "wide r");
    startHere(card && [...card.querySelectorAll("button")].find(b => /simulated/.test(b.textContent)), "none");
  },
  store(app){
    const tree = app.querySelector(".tree");
    inside(tree, `<b>THIS IS THE STORE</b><u>raw</u>: the original files, locked.<br><u>curated</u>: each AI keeps its own folder.<br><u>decisions</u>: written by people, never overwritten.`, "r");
    const panel = tree && tree.nextElementSibling;
    if (panel){ panel.classList.add("storepre"); inside(panel, `What an AI wrote, exactly as it sits in the Store. Plain text with labelled fields, so the next agent, from any vendor, can read it.`, "paper"); }
  },
};

function decorate(s){
  const lens = lensOf();
  document.body.classList.toggle("plain", lens === "plain");
  const nav = $("#nav");
  nav.insertAdjacentHTML("beforeend", `<span class="lens">${lens==="plain"?'<span class="hint">all the raw detail →</span>':""}<a class="${lens==="plain"?"on":""}" href="${link({lens:""})}">Plain view</a><a class="${lens==="eng"?"on":""}" href="${link({lens:"eng"})}">Engineer view</a></span>`);
  document.querySelectorAll("#app table").forEach(t => {
    const row = [...t.rows].find(r => r.querySelector("td.h")); if (!row) return;
    [...row.cells].forEach((c, i) => { if (c.classList.contains("h") && t.rows[0].cells[i]) t.rows[0].cells[i].classList.add("hh"); });
  });
  if (lens === "plain" && NOTES[s.view]) NOTES[s.view]($("#app"));
}

function render(){
  const s = state();
  $("#nav").innerHTML = navHtml(s);
  $("#app").innerHTML = s.view === "swap" ? swapView(s) : s.view === "store" ? storeView(s) : s.view === "live" ? liveView(s) : s.view === "handoff" ? handoffView(s) : screenView(s);
  decorate(s);
}
addEventListener("hashchange", render); render();
</script>
